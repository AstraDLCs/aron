[package]
name = "pulso-laboral"
version = "0.2.2"
description = "Pulso Laboral"
edition = "2021"

[lib]
name = "pulso_laboral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
