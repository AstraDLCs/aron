# Desarrollo local: puerto 8000, código montado, recarga en caliente, base de pruebas y CVs en una
# carpeta visible (fastapi/data/rrhh). Dokploy NO usa este archivo.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# (o poner COMPOSE_FILE en el .env local; ver .env.example)
services:
  db:
    volumes:
      - ./fastapi/docker/initdb:/docker-entrypoint-initdb.d:ro

  api:
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      CORS_ORIGINS: '["http://tauri.localhost","tauri://localhost","http://localhost:1420"]'
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulso}:${POSTGRES_PASSWORD:-pulso}@db:5432/pulso_test
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi:/srv
      - ./fastapi/data/rrhh:/data/rrhh

  worker:
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulso}:${POSTGRES_PASSWORD:-pulso}@db:5432/pulso_test
    volumes:
      - ./fastapi:/srv
      - ./fastapi/data/rrhh:/data/rrhh
