services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/rrhh:/data/rrhh
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Clasifica los CVs en cola con OpenRouter (sin OPENROUTER_API_KEY solo espera).
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data/rrhh:/data/rrhh
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
