# Desarrollo local: código montado, recarga en caliente y base de pruebas.
services:
  api:
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://pulso:pulso@db:5432/pulso_test
    volumes:
      - .:/srv

  worker:
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://pulso:pulso@db:5432/pulso_test
    volumes:
      - .:/srv
